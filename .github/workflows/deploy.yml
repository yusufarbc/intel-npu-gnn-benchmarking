name: Deploy Slidev to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'showcase/package-lock.json'

      - name: Copy Figures
        run: |
          mkdir -p showcase/public/figures
          cp results/figures/*.png showcase/public/figures/

      - name: Install dependencies
        run: npm ci
        working-directory: showcase

      - name: Build slides
        run: npx slidev build --base /npu-graph-opt-benchmarking/
        working-directory: showcase

      - name: Disable Jekyll
        run: touch showcase/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
